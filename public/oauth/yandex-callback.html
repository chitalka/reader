<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Подключение Яндекс.Диска</title>
  </head>
  <body>
    <p>Завершаем подключение…</p>
    <script>
      (() => {
        const parameters = new URLSearchParams(location.search);
        const payload = {
          type: 'chitalka:yandex-oauth',
          code: parameters.get('code'),
          state: parameters.get('state'),
          error: parameters.get('error'),
          errorDescription: parameters.get('error_description'),
        };
        if (window.opener) window.opener.postMessage(payload, location.origin);
        window.close();
      })();
    </script>
  </body>
</html>
